name: Seguridad estática - SAST y secretos
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sast:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Semgrep
        run: python -m pip install --upgrade semgrep
      - name: Análisis con reglas comunitarias
        run: semgrep scan --config p/owasp-top-ten --config p/secrets --json --output semgrep.json || true
      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-semgrep
          path: semgrep.json
          if-no-files-found: warn
  secretos:
    # Gitleaks-action requiere licencia en organizaciones (ver docs/SECURITY.md).
    # Alternativa: gitleaks CLI sin acción, no requiere licencia.
    name: Gitleaks CLI (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar Gitleaks CLI
        run: |
          VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep '"tag_name"' | cut -d'v' -f2 | cut -d'"' -f1)
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz
          sudo mv gitleaks /usr/local/bin/
      - name: Detección de secretos
        run: gitleaks detect --source . --redact --exit-code 0 --report-format json --report-path gitleaks.json || true
      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-gitleaks
          path: gitleaks.json
          if-no-files-found: warn
